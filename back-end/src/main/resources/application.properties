spring.application.name=managesys

############################################
# 로그인 히스토리 자동 정리 (분기별)
# dump-path: 덤프 CSV 파일이 저장될 디렉토리 경로 (직접 지정)
############################################
app.login-history.dump-path=C:/managesys/dumps

############################################
# DevTools - 재시작 시 "web application stopped already" 오류 나면 true 로 변경 후 사용
############################################
spring.devtools.restart.enabled=false

############################################
# 고객 첨부파일 업로드
# cust-file-dir: 첨부파일 실체가 저장될 디렉토리 (직접 지정)
############################################
app.upload.cust-file-dir=C:/managesys/uploads/customer
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

############################################
# 개인정보 암호화 (AES-256-GCM)
# key: Base64 인코딩된 32바이트 AES-256 키.
# ⚠ 키는 소스/설정파일에 하드코딩하지 말 것 (암호화 무력화). 반드시 환경변수로 주입한다.
#    - 로컬/운영 공통: 환경변수 APP_ENCRYPTION_KEY 설정 (미설정 시 EncryptionUtil 이 기동 시 예외 발생 → fail-fast)
#    - 운영은 외부 키스토어(Vault, AWS Secrets Manager 등) 사용 권장
#    - 키 분실 시 기존 암호문 복호화 불가 → 키를 안전하게 백업할 것
############################################
app.encryption.key=${APP_ENCRYPTION_KEY:}

############################################
# JWT 서명 키. 환경변수 APP_JWT_SECRET 로 주입(.env 또는 운영 키스토어). 32바이트 이상 권장.
#   - 고정값 주입 시 서버를 재시작해도 기존 로그인 토큰이 유지된다.
#   - 미설정 시 JwtProvider 가 부팅마다 랜덤 키로 폴백 → 재시작할 때마다 전체 토큰 무효화(로그아웃).
#   ⚠ 키는 소스/커밋되는 설정파일에 하드코딩하지 말 것 (.env 는 .gitignore 차단됨). APP_ENCRYPTION_KEY 와 동일 정책.
############################################
app.jwt.secret=${APP_JWT_SECRET:}

############################################
# Server
############################################
server.port=8085

############################################
# MariaDB Datasource (JDBC)
############################################
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:3307/managesys
spring.datasource.username=root
spring.datasource.password=1234

############################################
# JPA / Hibernate
############################################
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

####################################
# MyBatis
####################################
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.sys.managesys.common.dto
mybatis.configuration.map-underscore-to-camel-case=true

############################################
# Connection Pool (HikariCP)
############################################
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

############################################
# Logging
############################################
logging.level.org.mybatis=DEBUG
logging.level.org.mybatis.spring.SqlSessionUtils=DEBUG
logging.level.org.mybatis.spring.SqlSessionTemplate=DEBUG

logging.level.org.springframework.jdbc=DEBUG
logging.level.org.springframework.jdbc.datasource=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG


logging.file.name=logs/app.log